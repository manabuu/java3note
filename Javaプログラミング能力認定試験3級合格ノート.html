<script>(function(){
'use strict';
var D = JSON.parse(document.getElementById('data').textContent);
var LET = ['ア','イ','ウ','エ'];
var JP = /[぀-ヿ一-鿿＀-￯]/;
var app = document.getElementById('app');

/* ---------- storage (per-viewer convenience only) ---------- */
var S = {};
try { S = JSON.parse(localStorage.getItem('j3note') || '{}') || {}; } catch (e) { S = {}; }
S.drill = S.drill || {}; S.mock = S.mock || {};
function save(){ try { localStorage.setItem('j3note', JSON.stringify(S)); } catch (e) {} }

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function inline(s){ s = esc(s); s = s.replace(/`([^`]+)`/g, '<code>$1</code>'); s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); return s; }
function md(body){
  if(!body) return '';
  var out = [], lines = body.split('\n'), i = 0;
  while(i < lines.length){
    var l = lines[i];
    if(/^- /.test(l)){ var li = []; while(i < lines.length && /^- /.test(lines[i])) li.push('<li>' + inline(lines[i++].slice(2)) + '</li>'); out.push('<ul>' + li.join('') + '</ul>'); }
    else if(/^\d+\. /.test(l)){ var lo = []; while(i < lines.length && /^\d+\. /.test(lines[i])) lo.push('<li>' + inline(lines[i++].replace(/^\d+\. /, '')) + '</li>'); out.push('<ol>' + lo.join('') + '</ol>'); }
    else if(l.trim() === ''){ i++; }
    else { out.push('<p>' + inline(l) + '</p>'); i++; }
  }
  return out.join('');
}
var KW = {}; ('abstract boolean break byte case catch char class continue default do double else enum extends final finally float for if implements import instanceof int interface long new package private protected public return short static super switch this throw throws try void while null true false').split(' ').forEach(function(k){ KW[k] = 1; });
var TOK = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(⟦\d+⟧)|(0[xX][0-9a-fA-F]+|\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?[LlFf]?\b)|([A-Za-z_$][\w$]*)/g;
function hl(src, bs){
  var out = '', last = 0, m; TOK.lastIndex = 0;
  while((m = TOK.exec(src))){
    out += esc(src.slice(last, m.index)); last = TOK.lastIndex;
    if(m[1]) out += '<span class="c">' + esc(m[1]) + '</span>';
    else if(m[2]) out += '<span class="s">' + esc(m[2]) + '</span>';
    else if(m[3]){ var n = m[3].slice(1, -1); var v = bs && bs[n]; out += '<span class="blank' + (v != null ? ' filled' : '') + '" data-act="goq" data-q="b' + n + '" data-b="' + n + '" role="button" tabindex="0">' + (v != null ? esc(v) : '(' + n + ')') + '</span>'; }
    else if(m[4]) out += '<span class="n">' + m[4] + '</span>';
    else { var w = m[5]; if(KW[w]) out += '<span class="k">' + w + '</span>'; else if(/^[A-Z]/.test(w)) out += '<span class="t">' + w + '</span>'; else if(src.charAt(last) === '(') out += '<span class="f">' + w + '</span>'; else out += w; }
  }
  return out + esc(src.slice(last));
}
function codeBlock(src, o){
  o = o || {}; src = src.replace(/\n$/, ''); var lines = src.split('\n');
  var g = o.ln ? '<pre class="ln" aria-hidden="true">' + lines.map(function(_, i){ return i + 1; }).join('\n') + '</pre>' : '';
  return '<div class="code">' + g + '<pre class="src"><code>' + hl(src, o.bs) + '</code></pre></div>';
}
function outBox(txt, cls, label){ return '<div class="out ' + (cls || 'exe') + '"><span>' + (label || 'JVM での実行結果') + '</span><pre>' + esc(txt) + '</pre></div>'; }
function table(rows, cls){
  var h = rows[0], b = rows.slice(1);
  return '<div class="tbl"><table class="' + (cls || '') + '"><thead><tr>' + h.map(function(c){ return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    b.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
}
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

/* ---------- questions ---------- */
var QA = {};
D.mock.questions.forEach(function(q){ QA[q.id] = q; });
D.mock.programs.forEach(function(p){ p.blank_list.forEach(function(q){ QA[q.id] = q; }); });
D.drills.forEach(function(q){ QA[q.id] = q; });
var CH = {}; D.chapters.forEach(function(c){ CH[c.id] = c; });
function isMono(q){ return q.choices && q.choices.every(function(c){ return !JP.test(c); }); }
function choicesHTML(q, sel, mode, scope){
  var items = q.kind === 'tf' ? ['正しい', '誤り'] : q.choices, mono = q.kind !== 'tf' && isMono(q);
  return '<div class="choices" role="radiogroup" aria-label="選択肢" data-q="' + q.id + '">' + items.map(function(t, i){
    var c = 'ch' + (mono ? ' mono' : '');
    if(sel === i) c += ' sel';
    if(mode === 'mark'){ if(i === q.ans) c += ' right'; else if(sel === i) c += ' wrong'; }
    var dis = (mode === 'mark') ? ' disabled' : '';
    return '<button type="button" class="' + c + '" role="radio" aria-checked="' + (sel === i) + '" data-act="pick" data-scope="' + scope + '" data-q="' + q.id + '" data-i="' + i + '"' + dis + '><span class="bub">' + LET[i] + '</span><span class="txt">' + (mono ? esc(t) : inline(t)) + '</span></button>';
  }).join('') + '</div>';
}

/* ---------- drills ---------- */
function drillHTML(q, n){
  var st = S.drill[q.id], sel = st ? st.c : undefined, done = !!st;
  var h = '<article class="q" id="dr-' + q.id + '" data-kind="drill"><header><span class="no">ドリル ' + n + '</span><h4>' + inline(q.q) + '</h4></header>';
  if(q.code) h += codeBlock(q.code, { ln: true });
  h += choicesHTML(q, sel, done ? 'mark' : 'open', 'drill');
  if(done){
    var ok = sel === q.ans;
    h += '<div class="exp ' + (ok ? 'ok' : 'ng') + '"><strong>' + (ok ? '正解です' : '不正解　正解は「' + LET[q.ans] + '」') + '</strong>' + inline(q.exp) + '<br><button type="button" class="btn small" data-act="retry" data-q="' + q.id + '">もう一度</button></div>';
  }
  return h + '</article>';
}
function drillPick(id, i){
  var q = QA[id]; if(S.drill[id]) return;
  S.drill[id] = { c: i, ok: i === q.ans }; save();
  var ch = D.drills.filter(function(d){ return d.topic === q.topic; }); var n = ch.indexOf(q) + 1;
  var el = document.getElementById('dr-' + id); el.outerHTML = drillHTML(q, n);
  var sc = document.getElementById('dprog'); if(sc) sc.textContent = drillProgress(q.topic);
}
function drillProgress(ch){
  var l = D.drills.filter(function(d){ return d.topic === ch; }), a = 0, o = 0;
  l.forEach(function(d){ var s = S.drill[d.id]; if(s){ a++; if(s.ok) o++; } });
  return o + ' / ' + l.length + ' 問正解' + (a > o ? '（挑戦済み ' + a + '）' : '');
}

/* ---------- views: trace ---------- */
var TS = { id: 1, i: 0, timer: null };
function stopTrace(){ if(TS.timer){ clearInterval(TS.timer); TS.timer = null; } }
function traceSteps(t){ var s = t.steps.slice(); s.push({ line: null, vars: t.steps[t.steps.length - 1].vars, end: true }); return s; }
function varOrder(t){ var o = []; t.steps.forEach(function(s){ Object.keys(s.vars).forEach(function(k){ if(o.indexOf(k) < 0) o.push(k); }); }); return o; }
function valHTML(v, pv){
  if(v && v.arr){ return '<div class="cells">' + v.arr.map(function(x, i){ var chg = pv && pv.arr && pv.arr[i] !== x; var isb = typeof x === 'boolean'; return '<span class="' + (chg ? 'chg ' : '') + (isb ? (x ? 't' : 'f') : '') + '"><i>' + i + '</i>' + (isb ? (x ? 'T' : 'F') : esc(x)) + '</span>'; }).join('') + '</div>'; }
  if(v && v.s !== undefined) return '<span class="val">"' + esc(v.s) + '"</span>';
  if(v && v.raw !== undefined) return '<span class="val">' + esc(v.raw) + '</span>';
  return '<span class="val">' + esc(String(v)) + '</span>';
}
function viewTrace(id){
  if(id < 1 || id > D.traces.length) id = 1;
  if(TS.id !== id){ TS.id = id; TS.i = 0; }
  stopTrace();
  var tabs = D.traces.map(function(t){ return '<button type="button" aria-pressed="' + (t.id === id) + '" data-act="ttab" data-id="' + t.id + '">' + t.id + '. ' + esc(t.title) + '</button>'; }).join('');
  var t = D.traces[id - 1];
  return '<div class="view"><div class="eyebrow">トレース道場</div><h1 style="margin-top:10px">1 行ずつ、変数の動きを追う</h1><p class="lead">ここに出る変数の値は、すべて JVM のデバッガ（jdb）でプログラムを 1 行ずつ実行して取得した実測値です。「次に実行される行」と、その行を実行する前の変数を表示します。</p>' +
    '<div class="tabsel" role="group" aria-label="トレースの選択">' + tabs + '</div><div id="tviewer"></div></div>';
}
function drawTrace(){
  var box = document.getElementById('tviewer'); if(!box) return;
  var t = D.traces[TS.id - 1], steps = traceSteps(t), n = steps.length;
  if(TS.i >= n) TS.i = n - 1; if(TS.i < 0) TS.i = 0;
  var s = steps[TS.i], p = TS.i > 0 ? steps[TS.i - 1] : null, order = varOrder(t);
  var lines = t.src.replace(/\n$/, '').split('\n');
  var code = lines.map(function(l, k){ var no = k + 1; return '<div class="tl' + (s.line === no ? ' cur' : '') + '" data-l="' + no + '"><span class="no">' + (s.line === no ? '▶ ' : '') + no + '</span><span class="tx">' + hl(l) + '</span></div>'; }).join('');
  var vars = order.filter(function(k){ return s.vars[k] !== undefined; }).map(function(k){
    var v = s.vars[k], pv = p ? p.vars[k] : undefined, chg = !s.end && p && JSON.stringify(v) !== JSON.stringify(pv);
    return '<div class="vr' + (chg ? ' chg' : '') + '"><b>' + esc(k) + '</b>' + valHTML(v, pv) + '</div>';
  }).join('') || '<div class="vr"><b>—</b><span class="val" style="color:var(--muted)">まだ変数はありません</span></div>';
  var note = s.end ? '<b>プログラム終了。</b>標準出力は下のとおりです。' : (t.notes[s.line] ? '<b>' + s.line + ' 行目：</b>' + inline(t.notes[s.line]) : '<b>' + s.line + ' 行目</b>を実行します。');
  box.innerHTML = '<p class="lead" style="margin:0 0 12px">' + inline(t.lead) + '</p><div class="tr-wrap"><div><div class="tcode" role="img" aria-label="コードと実行中の行">' + code + '</div><div class="tnote" aria-live="polite">' + note + '</div></div>' +
    '<div><div class="eyebrow" style="margin-bottom:8px">変数（この行を実行する前の値）</div><div class="vars">' + vars + '</div>' +
    (s.end && t.output ? '<div style="margin-top:12px">' + outBox(t.output, 'exe', '標準出力') + '</div>' : '') + '</div></div>' +
    '<div class="tctl"><button type="button" class="btn small" data-act="tfirst" aria-label="最初へ">⏮</button><button type="button" class="btn small" data-act="tprev" aria-label="1 つ戻る">◀ 戻る</button><button type="button" class="btn small primary" data-act="tnext" aria-label="1 つ進む">進む ▶</button><button type="button" class="btn small" data-act="tlast" aria-label="最後へ">⏭</button><button type="button" class="btn small" data-act="tplay">' + (TS.timer ? '⏸ 停止' : '▶ 自動再生') + '</button><input type="range" id="tr" min="0" max="' + (n - 1) + '" value="' + TS.i + '" aria-label="ステップ" data-act="tseek"><span style="font:600 13px var(--font-mono)">' + (TS.i + 1) + ' / ' + n + '</span></div>';
  var cur = $('.tl.cur', box); if(cur && cur.scrollIntoView && false) cur.scrollIntoView({ block: 'nearest' });
}

    h += '<section class="qsec" id="sec-' + s.no + '"><header><h2>問' + s.no + '　' + esc(s.title) + '</h2><span>1 問 ' + s.pt + ' 点 ／ ' + s.ids.length + ' 問</span></header><p class="lead" style="margin:10px 0 0">' + inline(s.instr) + '</p>';
    if(s.code) h += codeBlock(s.code, { ln: true });
    h += s.ids.map(function(id){ return qBlock(list.filter(function(x){ return x.q.id === id; })[0], mode); }).join('') + '</section>';
  });
  D.mock.programs.forEach(function(p){
    var bs = {}; if(mode === 'mark') p.blank_list.forEach(function(q){ bs[q.no] = q.choices[q.ans]; }); else p.blank_list.forEach(function(q){ var a = MS.ans[q.id]; if(a !== undefined) bs[q.no] = q.choices[a]; });
    h += '<section class="qsec" id="sec-' + p.no + '"><header><h2>問' + p.no + '　' + esc(p.title) + '</h2><span>1 問 ' + p.pt + ' 点 ／ ' + p.blank_list.length + ' 問</span></header><p class="lead" style="margin:10px 0 0">' + inline(p.instr) + '</p>' +
      '<div class="passage"><b>＜プログラムの説明＞</b><br>' + inline(p.passage) + '</div><div class="eyebrow" style="margin:12px 0 0">実行結果例（&gt; はコマンドプロンプト）</div><div class="exm">' + esc(p.example) + '</div>' + codeBlock(p.code, { ln: true, bs: bs }) +
      p.blank_list.map(function(q){ return qBlock({ q: q, pt: p.pt, no: q.no }, mode); }).join('') + '</section>';
  });
  return h;
}
function navSheet(){
  var rows = '';
  [1, 2, 3, 4, 5, 6].forEach(function(n){
    var items = mockList().filter(function(x){ return x.sec === n; });
    rows += '<div class="nrow"><b>問' + n + '</b>' + items.map(function(x){ return '<a href="#mock" data-act="goq" data-q="' + x.q.id + '" data-nav="' + x.q.id + '" class="' + (MS.ans[x.q.id] !== undefined ? 'on' : '') + '">' + x.no + '</a>'; }).join('') + '</div>';
  });
  return '<details class="nav-sheet" open><summary>解答状況（マークシート）</summary>' + rows + '</details>';
}
function answeredCount(){ return mockList().filter(function(x){ return MS.ans[x.q.id] !== undefined; }).length; }
function mockRun(){
  return '<div class="view"><div class="mbar"><span class="tm" id="tm">' + (MS.timed ? fmt(MS.left) : '時間無制限') + '</span><span id="cnt">回答 ' + answeredCount() + ' / 37</span><span class="sp"></span><button type="button" class="btn primary small" data-act="msubmit">採点する</button></div>' +
    '<div id="askbox">' + (MS.ask ? askHTML() : '') + '</div>' + navSheet() + sectionBlocks('open') + '<div class="pn"><span></span><button type="button" class="btn primary" data-act="msubmit">採点する</button></div></div>';
}
function askHTML(){ var un = 37 - answeredCount(); return '<div class="dlg" role="alertdialog"><p>' + (un ? '未回答が <b>' + un + '</b> 問あります。このまま採点しますか？' : 'すべて回答しました。採点しますか？') + '</p><button type="button" class="btn small" data-act="mcancel">戻る</button><button type="button" class="btn primary small" data-act="mgrade">採点する</button></div>'; }
function mockStart(){
  var cb = document.getElementById('timed'); MS.timed = cb ? cb.checked : true;
  MS.phase = 'run'; MS.ans = {}; MS.left = 3600; MS.ask = false; MS.res = null;
  if(MS.tick) clearInterval(MS.tick);
  MS.tick = setInterval(function(){
    if(MS.phase !== 'run' || !MS.timed) return;
    MS.left--; var tm = document.getElementById('tm'); if(tm){ tm.textContent = fmt(Math.max(MS.left, 0)); if(MS.left <= 300) tm.classList.add('low'); }
    if(MS.left <= 0) mockGrade();
  }, 1000);
  render();
}
function mockPick(id, i){
  if(MS.phase !== 'run') return;
  MS.ans[id] = i; var q = QA[id];
  $$('.choices[data-q="' + id + '"] .ch').forEach(function(b, k){ var on = k === i; b.classList.toggle('sel', on); b.setAttribute('aria-checked', on); });
  var nv = document.querySelector('[data-nav="' + id + '"]'); if(nv) nv.classList.add('on');
  var c = document.getElementById('cnt'); if(c) c.textContent = '回答 ' + answeredCount() + ' / 37';
  if(id.charAt(0) === 'b'){ var n = id.slice(1); $$('.blank[data-b="' + n + '"]').forEach(function(el){ el.textContent = q.choices[i]; el.classList.add('filled'); }); }
  if(MS.ask){ var ab = document.getElementById('askbox'); if(ab) ab.innerHTML = askHTML(); }
}
function mockGrade(){
  if(MS.tick){ clearInterval(MS.tick); MS.tick = null; }
  var total = 0, by = {}, wrong = {}, know = 0;
  mockList().forEach(function(x){
    var ok = MS.ans[x.q.id] === x.q.ans; by[x.sec] = by[x.sec] || { got: 0, max: 0, ok: 0, n: 0 };
    by[x.sec].max += x.pt; by[x.sec].n++;
    if(ok){ by[x.sec].got += x.pt; by[x.sec].ok++; total += x.pt; if(x.sec <= 4) know += x.pt; } else { wrong[x.q.topic] = (wrong[x.q.topic] || 0) + 1; }
  });
  MS.res = { total: total, by: by, wrong: wrong, know: know, used: MS.timed ? 3600 - Math.max(MS.left, 0) : null };
  MS.phase = 'result'; MS.filter = Object.keys(wrong).length ? 'wrong' : 'all';
  if(!S.mock.best || total > S.mock.best.score) S.mock.best = { score: total };
  S.mock.last = { score: total }; save();
  if(location.hash !== '#mock') location.hash = '#mock'; else render();
}
function mockResult(){
  var r = MS.res, pass = r.total >= 60;
  var rows = [1, 2, 3, 4, 5, 6].map(function(n){ var b = r.by[n]; return '<div class="rw"><span>問' + n + '</span><div class="tr"><i style="width:' + Math.round(b.got / b.max * 100) + '%"></i></div><span class="num">' + b.got + ' / ' + b.max + '</span></div>'; }).join('');
  var wk = Object.keys(r.wrong).map(Number).sort(function(a, b){ return r.wrong[b] - r.wrong[a]; });
  var list = mockList().filter(function(x){ return MS.filter === 'all' || MS.ans[x.q.id] !== x.q.ans; });
  var h = '<div class="view result"><div><div class="eyebrow">採点結果' + (r.used != null ? ' ／ 所要時間 ' + fmt(r.used) : '') + '</div><div class="big" style="margin-top:8px">' + r.total + '<small>/ 100 点</small></div><p style="margin:8px 0 0"><span class="pill ' + (pass ? 'ok' : 'ng') + '">' + (pass ? '合格ライン（60 点）に到達' : '合格ラインまであと ' + (60 - r.total) + ' 点') + '</span>　問1〜問4 の知識問題：<b>' + r.know + ' / 60 点</b></p></div>' +
    '<div class="card"><h3 style="margin-bottom:12px">大問ごとの得点</h3><div class="rows">' + rows + '</div></div>' +
    '<div class="card"><h3 style="margin-bottom:8px">復習のおすすめ</h3>' + (wk.length ? '<ul style="margin:0;padding-left:1.2em">' + wk.map(function(t){ return '<li><a href="#learn-' + t + '">第' + t + '章　' + esc(CH[t].title) + '</a>：' + r.wrong[t] + ' 問ミス</li>'; }).join('') + '</ul>' : '<p style="margin:0">全問正解です。')+ '</div></div>' +
    '<div class="tabs" role="group" aria-label="表示"><button type="button" aria-pressed="' + (MS.filter === 'wrong') + '" data-act="mfilter" data-f="wrong">間違えた問題（' + (37 - mockList().filter(function(x){ return MS.ans[x.q.id] === x.q.ans; }).length) + '）</button><button type="button" aria-pressed="' + (MS.filter === 'all') + '" data-act="mfilter" data-f="all">全問</button></div>';
  h += reviewBlocks(list) + '<div class="pn"><a class="btn" href="#learn">章に戻って復習する</a><button type="button" class="btn primary" data-act="mretry">もう一度受ける</button></div></div>';
  return h;
}
function reviewBlocks(list){
  if(!list.length) return '<p>表示する問題はありません。</p>';
  var h = '', lastSec = 0, ids = {}; list.forEach(function(x){ ids[x.q.id] = 1; });
  list.forEach(function(x){
    if(x.sec !== lastSec){ lastSec = x.sec; h += '<h2 style="margin-top:26px;font-size:18px">問' + x.sec + '</h2>'; if(x.sec === 2){ h += codeBlock(D.mock.sections[1].code, { ln: true }); } }
    if(x.sec >= 5){ var p = D.mock.programs[x.sec - 5]; if(!p._shown){ p._shown = 1; var bs = {}; p.blank_list.forEach(function(q){ bs[q.no] = q.choices[q.ans]; }); h += '<div class="eyebrow" style="margin-top:8px">正しい字句を入れたプログラム</div>' + codeBlock(p.code, { ln: true, bs: bs }); } }
    h += qBlock(x, 'mark');
  });
  D.mock.programs.forEach(function(p){ delete p._shown; });
  return h;
}

/* ---------- router ---------- */
function setNav(name){ $$('nav a').forEach(function(a){ var on = a.getAttribute('data-r') === name; if(on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }); }
function render(){
  stopTrace();
  var hsh = (location.hash || '#home').slice(1), parts = hsh.split('-'), name = parts[0], arg = parts[1] ? parseInt(parts[1], 10) : 0, html;
  if(name === 'learn') html = arg ? viewChapter(arg) : viewLearn();
  else if(name === 'trace') html = viewTrace(arg || TS.id);
  else if(name === 'mock') html = viewMock();
  else if(name === 'analysis') html = viewAnalysis();
  else { name = 'home'; html = viewHome(); }
  setNav(name); app.innerHTML = html;
  if(name === 'trace') drawTrace();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if(!b) return;
  var a = b.getAttribute('data-act');
  if(a === 'pick'){ var id = b.getAttribute('data-q'), i = +b.getAttribute('data-i'); if(b.getAttribute('data-scope') === 'drill') drillPick(id, i); else mockPick(id, i); }
  else if(a === 'retry'){ var q = QA[b.getAttribute('data-q')]; delete S.drill[q.id]; save(); var n = D.drills.filter(function(d){ return d.topic === q.topic; }).indexOf(q) + 1; document.getElementById('dr-' + q.id).outerHTML = drillHTML(q, n); var sc = document.getElementById('dprog'); if(sc) sc.textContent = drillProgress(q.topic); }
  else if(a === 'goq'){ e.preventDefault(); var el = document.getElementById('q-' + b.getAttribute('data-q')); if(el){ el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('sel-flash'); setTimeout(function(){ el.classList.remove('sel-flash'); }, 900); } }
  else if(a === 'ttab'){ location.hash = '#trace-' + b.getAttribute('data-id'); }
  else if(a === 'tnext'){ TS.i++; drawTrace(); } else if(a === 'tprev'){ TS.i--; drawTrace(); }
  else if(a === 'tfirst'){ TS.i = 0; drawTrace(); } else if(a === 'tlast'){ TS.i = 9999; drawTrace(); }
  else if(a === 'tplay'){ if(TS.timer){ stopTrace(); drawTrace(); } else { if(TS.i >= traceSteps(D.traces[TS.id - 1]).length - 1) TS.i = 0; TS.timer = setInterval(function(){ var n = traceSteps(D.traces[TS.id - 1]).length; if(TS.i >= n - 1){ stopTrace(); } else TS.i++; drawTrace(); }, 900); drawTrace(); } }
  else if(a === 'mstart') mockStart();
  else if(a === 'msubmit'){ MS.ask = true; var ab = document.getElementById('askbox'); if(ab){ ab.innerHTML = askHTML(); ab.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
  else if(a === 'mcancel'){ MS.ask = false; var ab2 = document.getElementById('askbox'); if(ab2) ab2.innerHTML = ''; }
  else if(a === 'mgrade') mockGrade();
  else if(a === 'mfilter'){ MS.filter = b.getAttribute('data-f'); render(); }
  else if(a === 'mretry'){ MS.phase = 'intro'; MS.res = null; render(); }
});
document.addEventListener('input', function(e){ if(e.target && e.target.getAttribute('data-act') === 'tseek'){ TS.i = +e.target.value; drawTrace(); var r = document.getElementById('tr'); if(r) r.focus(); } });
document.addEventListener('keydown', function(e){
  if(location.hash.indexOf('#trace') === 0 && !/INPUT|TEXTAREA/.test(e.target.tagName)){ if(e.key === 'ArrowRight'){ TS.i++; drawTrace(); } if(e.key === 'ArrowLeft'){ TS.i--; drawTrace(); } }
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('blank')){ e.preventDefault(); e.target.click(); }
});
render();
})();
</script>
</body>
</html>
